---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: redis-cluster-restart
spec:
  steps:
    - try:
        - apply:
            file: cluster.yaml
        - apply:
            file: ../../../data-assert/resources.yaml
        - assert:
            file: ready-cluster.yaml

    - name: Wait for data assertion helper
      try:
        - script:
            timeout: 190s
            content: |
              set -eu
              if ! kubectl -n "${NAMESPACE}" wait pod/data-assert --for=condition=Ready --timeout=180s; then
                columns='PHASE:.status.phase,WAITING:.status.containerStatuses[*].state.waiting.reason'
                columns="$columns,TERMINATED:.status.containerStatuses[*].state.terminated.reason"
                columns="$columns,EXIT:.status.containerStatuses[*].state.terminated.exitCode,RESTARTS:.status.containerStatuses[*].restartCount"
                kubectl -n "${NAMESPACE}" get pod/data-assert -o "custom-columns=$columns"
                exit 1
              fi
              kubectl -n "${NAMESPACE}" exec data-assert -c data-assert -- test -s /go/src/data-assert/main.go

    - name: Put data
      try:
        - script:
            timeout: 90s
            content: >
              kubectl exec --namespace ${NAMESPACE} --container data-assert data-assert --
              bash -c  "cd /go/src/data-assert && go run main.go gen-redis-data --host redis-cluster-v1beta2-leader.${NAMESPACE}.svc.cluster.local:6379 --mode cluster"
            check:
              (contains($stdout, 'OK')): true

    - name: Restart pods at same time
      try:
        - script:
            timeout: 30s
            content: >
              kubectl delete pod --namespace ${NAMESPACE} -l app=redis-cluster-v1beta2-leader

    - name: Wait for cluster to react to restart
      try:
        - assert:
            file: disrupted-cluster.yaml

    - name: Wait cluster to be ready
      try:
        - assert:
            file: ready-cluster.yaml

    - name: Assert data
      try:
        - script:
            timeout: 60s
            content: >
              kubectl exec --namespace ${NAMESPACE} --container data-assert data-assert --
              bash -c "cd /go/src/data-assert && go run main.go chk-redis-data --host redis-cluster-v1beta2-leader.${NAMESPACE}.svc.cluster.local:6379 --mode cluster"
            check:
              (contains($stdout, 'OK')): true
