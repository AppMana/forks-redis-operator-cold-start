name: Validate Commit Messages and Authors

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned commitlint
        run: npm install --no-save --package-lock=false @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Released upstream history is imported intact, never rewritten to
          # satisfy fork message rules. All new fork commits remain in scope.
          # OT-CONTAINER-KIT/redis-operator v0.27.0:
          UPSTREAM_RELEASE_SHA: 71954323c9191e6171f3eb04f80bb46a5f128306
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --git-log-args="^$UPSTREAM_RELEASE_SHA" --verbose
