name: Publish Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - cold-start-bootstrap
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Lowercased because GHCR requires it. Repository is ghcr.io/appmana/forks-redis-operator-cold-start.
  IMAGE: ghcr.io/appmana/forks-redis-operator-cold-start

jobs:
  release-ghcr-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            # Mark the cold-start-bootstrap branch head as :latest for convenience.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/cold-start-bootstrap' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IMG=${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
