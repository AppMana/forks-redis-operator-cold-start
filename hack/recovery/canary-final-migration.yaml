apiVersion: v1
kind: Namespace
metadata:
  name: redis-upgrade-canary-migration
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: upgrade
  namespace: redis-upgrade-canary-migration
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    updateStrategy:
      type: OnDelete
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: standard
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: upgrade
  namespace: redis-upgrade-canary-migration
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisSentinelConfig:
    redisReplicationName: upgrade
    masterGroupName: upgrade
    resolveHostnames: "no"
    announceHostnames: "no"
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.0.15
    imagePullPolicy: IfNotPresent
    updateStrategy:
      type: OnDelete
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {memory: 128Mi}
