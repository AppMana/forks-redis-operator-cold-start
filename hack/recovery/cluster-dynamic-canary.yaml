apiVersion: v1
kind: Namespace
metadata:
  name: redis-upgrade-canary-cluster-dynamic
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: dynamic
  namespace: redis-upgrade-canary-cluster-dynamic
spec:
  clusterSize: 1
  clusterVersion: v7
  persistenceEnabled: true
  redisConfig:
    dynamicConfig:
      - slowlog-log-slower-than 5000
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
